name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Cleaner.Tests/Cleaner.Tests.csproj --locked-mode

      - name: Build
        run: dotnet build Cleaner.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Cleaner.Tests/Cleaner.Tests.csproj --configuration Release --no-restore

      - name: Publish portable executable
        run: ./scripts/publish-windows.ps1

      - name: Verify published executable
        run: |
          if (!(Test-Path publish/win-x64/Cleaner.exe)) { throw "Cleaner.exe was not published" }
